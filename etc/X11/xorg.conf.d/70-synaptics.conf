# found at /etc/X11/xorg.conf.d/70-synaptics.conf
Section "InputClass"
    Identifier "touchpad"
    Driver "synaptics"
    MatchIsTouchpad "on"
    	# no separate physical buttons = clickpad
    	Option "ClickPad" "true"

	# tap buttons are available
        Option "TapButton1" "1"
        Option "TapButton2" "3"
        Option "TapButton3" "2"

	# scrolling from edges disabled
        Option "VertEdgeScroll" "off"
        Option "HorizEdgeScroll" "off"

	# scrolling with 2 fingers is enabled
        Option "VertTwoFingerScroll" "on"
        Option "HorizTwoFingerScroll" "on"
        Option "CircularScrolling" "on"
        Option "CircScrollTrigger" "2"

        Option "EmulateTwoFingerMinZ" "40"
        Option "EmulateTwoFingerMinW" "8"
        Option "CoastingSpeed" "0"

	# Low is pressure to release
	# High is pressure to activate
	# Tap time limits how long tap can take to be considered a tap
        Option "FingerLow" "30"
        Option "FingerHigh" "75"
        Option "MaxTapTime" "90"

	# Scrolling Is normal (not natural). Higher numbers are slower somehow
	Option "VertScrollDelta" "75"

	# Right Click is first 4 param (L, R, Top, Bottom edge)
	# it is the right 40% of bottom 18% on touchpad
	# Middle Click is last 4 param (L, R, Top, Bottom edge)
	# it is the middle 20% of bottom 18% on clickpad
        Option "SoftButtonAreas"  "60% 0 82% 0 40% 59% 82% 0"
EndSection
