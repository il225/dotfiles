# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 1
}

# order += "ipv6"
order += "wireless _first_"
# order += "ethernet _first_"
order += "battery all"
order += "disk /"
# order += "load"
order += "memory"
order += "tztime local"

wireless _first_ {
        format_up = "W:%quality from %essid"
	#: I don't like having my IP so publicly shown
	# %essid %ip omitted
        format_down = "W: Down"
}

# ethernet _first_ {
#         format_up = "E: %ip (%speed)"
#         format_down = "E: down"
# }

battery all {
        format = "%status %percentage (%remaining)"
	status_chr = "CHR 󱐋"
	status_bat = "BAT 󰁿"
	status_unk = "UNK ?"
 	status_full = "FULL 󰂄"
	status_idle = "IDLE"
#	path = "/sys/class/power_supply/BAT0/uevent"
}

disk "/" {
#	format = "%used / %avail"
	#: I prefer to see the used and total
        format = "%used / %total"
}

# load {
#         format = "LOAD %1min"
# }

memory {
#	format = "%used of %available"
	#: I prefer to see the used and total here too
        format = "%used of %total"
        threshold_degraded = "1G"
        format_degraded = "MEMORY < %available"
}

tztime local {
	#: 12 hour time, MM/DD/YY, and unicode for style
        format = "󰸘 %m-%d-%Y  %I:%M%P " 
}
